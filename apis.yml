name: Finn
description: 'FINN (finn.com) is a Munich-based consumer car-subscription service that lets
  individuals and businesses lease a car on a flexible monthly subscription, with insurance,
  maintenance, registration, taxes, and roadside assistance bundled into one all-inclusive
  price. Subscribers pick from more than twenty vehicle brands on terms from six to twenty-four
  months, and the company also runs a fleet/business offering. Backed by HV Capital, FINN
  operates in Germany, the United States, and other European markets. FINN is a consumer,
  direct-to-customer business with no public developer API or partner API program surfaced at
  this time; this profile captures its public web, security, and legal surface for the API
  Evangelist network.'
